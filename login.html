<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F8F6F1">
    <title>تسجيل الدخول | SkillUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="js/login.js" defer></script>
</head>

<body class="auth-page">
    <main class="auth-shell">
        <a class="brand auth-brand" href="index.html#home" aria-label="العودة إلى SkillUp الرئيسية">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span class="brand__name">Skill<span>Up</span></span>
        </a>

        <section class="auth-card" aria-labelledby="login-title">
            <div class="auth-card__heading">
                <p class="eyebrow">مرحباً بعودتك</p>
                <h1 class="auth-card__title" id="login-title">تسجيل الدخول</h1>
                <p class="auth-card__description">أدخل بياناتك للمتابعة إلى حسابك.</p>
            </div>

            <form class="auth-form" data-login-form novalidate>
                <div class="form-field auth-field">
                    <label class="input-label" for="login-email">البريد الإلكتروني</label>
                    <input class="input" id="login-email" name="email" type="email" inputmode="email"
                        autocomplete="email" placeholder="name@example.com" required
                        aria-describedby="login-email-error">
                    <span class="auth-field__error" id="login-email-error" data-error-for="email" hidden></span>
                </div>

                <div class="form-field auth-field">
                    <label class="input-label" for="login-password">كلمة المرور</label>
                    <div class="auth-password">
                        <input class="input" id="login-password" name="password" type="password"
                            autocomplete="current-password" placeholder="أدخل كلمة المرور" required
                            aria-describedby="login-password-error">
                        <button class="auth-password__toggle" type="button" data-password-toggle="login-password"
                            aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button>
                    </div>
                    <span class="auth-field__error" id="login-password-error" data-error-for="password" hidden></span>
                </div>

                <div class="auth-options">
                    <label class="auth-checkbox" for="remember-me">
                        <input id="remember-me" name="remember" type="checkbox">
                        <span>تذكرني على هذا الجهاز</span>
                    </label>
                    <a class="auth-link" href="#forgot-password-message" data-forgot-password>نسيت كلمة المرور؟</a>
                </div>
                <p class="auth-message auth-message--muted" id="forgot-password-message" role="status" hidden>
                    استعادة كلمة المرور غير متاحة في هذه النسخة التجريبية.
                </p>

                <button class="button button--primary auth-submit" type="submit">تسجيل الدخول</button>
                <p class="auth-message" data-form-message role="status" aria-live="polite" hidden></p>
            </form>

            <p class="auth-switch">ليس لديك حساب؟ <a class="auth-link" href="register.html">أنشئ حساباً جديداً</a></p>
            <a class="auth-home-link" href="index.html#home">العودة إلى الصفحة الرئيسية</a>
        </section>
    </main>
</body>

</html>
